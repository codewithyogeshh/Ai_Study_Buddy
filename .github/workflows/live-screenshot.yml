name: Live site screenshot

# Captures the deployed site with a real browser and commits the image, so the
# README always shows what the live URL actually renders.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-screenshot.yml'
      - 'scripts/screenshot.mjs'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: live-screenshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the preview browser
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Capture the live site
        run: node scripts/screenshot.mjs

      - name: Commit the screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/live-site.png
          if git diff --staged --quiet; then
            echo "Screenshot unchanged."
            exit 0
          fi
          git commit -m "chore: refresh live site screenshot"
          git push
