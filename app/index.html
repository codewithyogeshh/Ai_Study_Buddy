<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <title>AI Study Buddy — Your personal AI learning companion</title>
    <meta
      name="description"
      content="Turn your PDFs into summaries, notes, quizzes, flashcards and viva practice. Your personal AI learning companion."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('asb.theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta && t === 'dark') meta.setAttribute('content', '#08080d')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
